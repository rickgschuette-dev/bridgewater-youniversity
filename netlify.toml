# Netlify build & functions configuration for Bridgewater YOU.
#
# [functions] tells Netlify where the serverless "relay" functions live.
# Those functions exist to fix a known Google Apps Script quirk: a POST to
# an Apps Script Web App's /exec URL returns an HTTP redirect to a one-time
# content URL rather than the real response, and Netlify's own outgoing
# webhook feature doesn't follow that redirect correctly. See the comments
# at the top of netlify/functions/relay-teacher.js and relay-forum.js for
# the full explanation.

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Class Discussion: any address like /class-discussion/betsy-marvin shows the teacher page template.
# The page itself reads the teacher's name from the address. Real files always win over this rule, so
# no other page is affected, and /class-discussion on its own is the landing page (class-discussion.html).
[[redirects]]
  from = "/class-discussion/*"
  to = "/class-discussion-teacher.html"
  status = 200

# Seminar Discussion: any address like /seminar-discussion/john-doe shows the seminar leader page template.
# Same idea as the Class Discussion rule above; /seminar-discussion on its own is the landing page (seminar-discussion.html).
[[redirects]]
  from = "/seminar-discussion/*"
  to = "/seminar-discussion-leader.html"
  status = 200

# Class-Specific Registration Pages: each promoted class has its own one-class registration page and
# thank-you page, kept in the folder "Class-Specific Registrations Pages". These rules give each pair
# a short, clean address (the folder name has spaces, written %20 here). Add two rules per new class.
# See the README.md in that folder for the copy-and-change steps.

# Fundamentals of Art History
[[redirects]]
  from = "/art-history"
  to = "/Class-Specific%20Registrations%20Pages/art-history.html"
  status = 200

[[redirects]]
  from = "/art-history-thank-you"
  to = "/Class-Specific%20Registrations%20Pages/art-history-thank-you.html"
  status = 200

