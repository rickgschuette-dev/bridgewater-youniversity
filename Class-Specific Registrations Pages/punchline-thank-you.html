<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You | Bridgewater YOU</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B2A5C">
<style>
  body { margin: 0; background: #FBF3E5; font-family: Georgia, 'Times New Roman', serif; color: #0B2A5C; }
  a { color: #0B2A5C; }
  a:hover { color: #7A5400; }
  .page { min-height: 100vh; display: flex; flex-direction: column; }
  header { background: #0B2A5C; border-bottom: 5px solid #C78F14; padding: 18px 16px; }
  .header-inner { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .header-inner img { width: 92px; height: 92px; border-radius: 50%; object-fit: cover; background: #fff; }
  .header-title { color: #FBF3E5; font-size: 34px; font-style: italic; text-align: center; line-height: 1.25; margin: 0; }
  main { flex-grow: 1; padding: 56px 16px 64px; }
  .box { max-width: 760px; margin: 0 auto; background: #fff; border: 2px solid #0B2A5C; border-top: 8px solid #C78F14; border-radius: 8px; padding: 40px 32px; text-align: center; box-sizing: border-box; }
  h1 { margin: 0 0 16px; font-size: 40px; line-height: 1.15; }
  .msg { margin: 0 0 12px; font-size: 21px; line-height: 1.5; }
  .note { margin: 0 0 32px; font-size: 18px; line-height: 1.5; font-family: system-ui, sans-serif; }
  .button { display: inline-block; box-sizing: border-box; font-family: system-ui, sans-serif; font-size: 19px; font-weight: 700; background: #0B2A5C; color: #FBF3E5; border-bottom: 4px solid #C78F14; border-radius: 6px; padding: 14px 32px; min-height: 52px; text-decoration: none; }
  .button:hover { color: #FBF3E5; background: #123a7a; }
  footer { background: #0B2A5C; color: #FBF3E5; padding: 20px 16px; font-family: system-ui, sans-serif; font-size: 15px; }
  .footer-inner { max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: space-between; }
  footer a { color: #FBF3E5; }
</style>
</head>
<body>
<div class="page">

<header>
  <div class="header-inner">
    <a href="/"><img src="/assets/class-pages-logo.png" alt="Bridgewater YOU"></a>
    <p class="header-title">What's the Punchline: Low- and High-Class Poetry</p>
  </div>
</header>

<main>
  <div class="box">
    <h1>Thank You!</h1>
    <p class="msg">Your registration request for <strong>What's the Punchline: Low- and High-Class Poetry</strong> has been received.</p>
    <p class="note">Watch your email for confirmation and scheduling details.</p>
    <a class="button" href="/registration">Check Out Our Full Class List</a>
  </div>
</main>

<footer>
  <div class="footer-inner">
    <span>&copy; 2026 Bridgewater YOU</span>
    <a href="/">Home</a>
  </div>
</footer>

</div>
</body>
</html>
